[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docrep"
version = "0.2.0"
description = "DocRep: Evidence-backed repository maintenance workbench for dependency resilience"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DocRep Team" }]
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "requests>=2.28.0",
]

[project.scripts]
docrep = "repomedic.cli:cli"
repomedic = "repomedic.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["repomedic*", "docrep*"]
exclude = ["target_repo*", "tests*", "reports*", "skills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
